kind = "web"
previewPath = "/"
title = "UniRoute — Campus Bus Management"
version = "1.0.0"
id = "artifacts/campus-bus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18146

[services.development]
run = "pnpm --filter @workspace/campus-bus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-bus", "run", "build" ]
publicDir = "artifacts/campus-bus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18146"
BASE_PATH = "/"
